title: 留言板
date: 2026-04-15 12:00:00
comment: false
---

<style>
/* ========== 留言板：与文章页评论组件同一设计语言（主题 CSS 变量，明暗自动） ========== */
.gb {
  --gb-radius: 16px;
  --gb-line: var(--border-color, rgba(0, 0, 0, 0.08));
  --gb-soft: var(--second-text-color, #343a3c);
  --gb-muted: var(--third-text-color, #9595a2);
  --gb-paper: var(--second-background-color, #fafafa);
  --gb-chip: var(--third-background-color, #f7f7f7);
  --gb-brand: var(--primary-color, #5d3fd3);

  max-width: 820px;
  margin: 0 auto;
  padding: 0 4px 3.5rem;
  color: var(--default-text-color, #373d3f);
  font-size: 15px;
  line-height: 1.7;
  text-align: left;
}

/* ---------- 头部 ---------- */
.gb-head {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 10px 14px;
  margin: 0 0 18px;
}
.gb-sub {
  margin: 0;
  color: var(--gb-muted);
  font-size: 13.5px;
}
.gb-count {
  display: inline-flex;
  margin-left: 8px;
  vertical-align: 1px;
  align-items: center;
  padding: 2px 11px;
  border-radius: 999px;
  background: var(--gb-chip);
  color: var(--gb-brand);
  font-size: 12.5px;
  font-weight: 700;
  letter-spacing: 0.01em;
}

/* ---------- 编辑器 ---------- */
.gb-guest {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 14px;
  padding: 18px;
  border: 1px dashed var(--gb-line);
  border-radius: var(--gb-radius);
  background: var(--gb-paper);
}
.gb-guest-tip {
  min-width: 0;
  color: var(--gb-soft);
  font-size: 14px;
}
.gb-guest-tip b {
  color: var(--first-text-color, #323739);
}

.gb-editor {
  padding: 16px;
  border: 1.5px solid var(--gb-line);
  border-radius: var(--gb-radius);
  background: var(--gb-paper);
  transition: border-color 0.2s ease, box-shadow 0.2s ease;
}
.gb-editor:focus-within,
.gb-reply:focus-within {
  border-color: var(--gb-brand);
  box-shadow: 0 0 0 4px rgba(124, 108, 255, 0.14);
}
.gb-identity {
  display: flex;
  align-items: center;
  gap: 9px;
  margin-bottom: 10px;
  color: var(--gb-soft);
  font-size: 13px;
}
.gb-identity b {
  color: var(--first-text-color, #323739);
  font-weight: 700;
}
.gb-editor textarea,
.gb-reply textarea {
  display: block;
  width: 100%;
  min-height: 92px;
  padding: 0;
  border: 0;
  outline: none;
  resize: none;
  background: transparent;
  color: inherit;
  font: inherit;
  line-height: 1.7;
}
.gb-reply textarea {
  min-height: 64px;
}
.gb-editor textarea::placeholder,
.gb-reply textarea::placeholder {
  color: var(--gb-muted);
}
.gb-editor-foot {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-top: 10px;
}
.gb-counter {
  margin-right: auto;
  color: var(--gb-muted);
  font-size: 12px;
  font-variant-numeric: tabular-nums;
}
.gb-counter.is-warn {
  color: #dc2626;
}

/* ---------- 按钮 ---------- */
.gb-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  height: 38px;
  padding: 0 18px;
  border: 0;
  border-radius: 10px;
  font: inherit;
  font-size: 14px;
  font-weight: 700;
  white-space: nowrap;
  text-decoration: none;
  cursor: pointer;
  transition: transform 0.15s ease, opacity 0.2s ease, box-shadow 0.2s ease,
    background-color 0.2s ease, color 0.2s ease;
}
.gb-btn.primary {
  color: #fff;
  background: linear-gradient(135deg, var(--gb-brand), #8b5cf6);
  box-shadow: 0 8px 18px rgba(40, 71, 186, 0.2);
}
.gb-btn.primary:hover:not(:disabled) {
  transform: translateY(-1px);
  box-shadow: 0 10px 22px rgba(40, 71, 186, 0.26);
}
.gb-btn.ghost {
  border: 1px solid var(--gb-line);
  background: transparent;
  color: var(--gb-soft);
}
.gb-btn.ghost:hover:not(:disabled) {
  color: var(--gb-brand);
  border-color: var(--gb-brand);
}
.gb-btn:disabled {
  opacity: 0.55;
  cursor: not-allowed;
}
.gb-btn.small {
  height: 32px;
  padding: 0 14px;
  font-size: 13px;
}

/* ---------- 工具条 ---------- */
.gb-toolbar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 10px 14px;
  margin: 26px 0 4px;
}
.gb-tabs {
  display: inline-flex;
  gap: 2px;
}
.gb-tab {
  height: 32px;
  padding: 0 14px;
  border: 0;
  border-radius: 999px;
  background: transparent;
  color: var(--gb-soft);
  font: inherit;
  font-size: 13.5px;
  font-weight: 600;
  cursor: pointer;
  transition: background-color 0.18s ease, color 0.18s ease;
}
.gb-tab:hover {
  background: var(--gb-chip);
}
.gb-tab.is-active {
  background: var(--gb-chip);
  color: var(--gb-brand);
}
.gb-search {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  height: 34px;
  padding: 0 13px;
  border: 1px solid transparent;
  border-radius: 999px;
  background: var(--gb-chip);
  transition: border-color 0.18s ease, background-color 0.18s ease;
}
.gb-search:focus-within {
  border-color: var(--gb-brand);
  background: var(--background-color, #fff);
}
.gb-search svg {
  flex: none;
  width: 14px;
  height: 14px;
  color: var(--gb-muted);
}
.gb-search input {
  width: 160px;
  border: 0;
  outline: none;
  background: transparent;
  color: inherit;
  font: inherit;
  font-size: 13.5px;
}
.gb-search input::placeholder {
  color: var(--gb-muted);
}

/* ---------- 列表 ---------- */
.gb-list {
  margin: 0;
  padding: 0;
  list-style: none;
}
.gb-item {
  display: flex;
  gap: 12px;
  padding: 20px 0;
  border-top: 1px solid var(--gb-line);
}
.gb-item.is-new {
  animation: gbFlash 1.8s ease;
}
.gb-avatar {
  flex: none;
  display: grid;
  place-items: center;
  width: 40px;
  height: 40px;
  border-radius: 50%;
  overflow: hidden;
  color: #fff;
  font-size: 16px;
  font-weight: 800;
  line-height: 1;
  user-select: none;
  box-shadow: 0 2px 8px rgba(17, 24, 39, 0.12);
}
.gb-avatar.sm {
  width: 32px;
  height: 32px;
  font-size: 13px;
}
.gb-avatar img {
  display: block;
  width: 100%;
  height: 100%;
  margin: 0 !important;
  border-radius: 0 !important;
  object-fit: cover;
}
.gb-body {
  flex: 1;
  min-width: 0;
}
.gb-meta {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
  font-size: 13px;
}
.gb-name {
  color: var(--first-text-color, #323739);
  font-weight: 700;
}
.gb-badge {
  padding: 0 7px;
  border-radius: 999px;
  background: rgba(245, 158, 11, 0.18);
  color: #d97706;
  font-size: 11px;
  font-weight: 700;
  line-height: 1.6;
}
.gb-replyto {
  color: var(--gb-muted);
  font-size: 13px;
}
.gb-replyto b {
  color: var(--gb-soft);
  font-weight: 600;
}
.gb-time {
  color: var(--gb-muted);
  font-size: 12px;
}
.gb-content {
  margin: 6px 0 0;
  white-space: pre-wrap;
  word-break: break-word;
}
.gb-content a {
  color: var(--gb-brand);
  text-decoration: none;
  border-bottom: 1px solid rgba(93, 63, 211, 0.28);
}
.gb-content a:hover {
  border-bottom-color: var(--gb-brand);
}
.gb-content img {
  display: block;
  background: var(--gb-chip);
  max-width: 100%;
  max-height: 320px;
  margin: 10px 0 0 !important;
  border-radius: 12px;
  object-fit: cover;
}
.gb-actions {
  display: flex;
  align-items: center;
  gap: 14px;
  margin-top: 8px;
}
.gb-link {
  padding: 0;
  border: 0;
  background: transparent;
  color: var(--gb-muted);
  font: inherit;
  font-size: 13px;
  cursor: pointer;
  transition: color 0.15s ease;
}
.gb-link:hover {
  color: var(--gb-brand);
}
.gb-link.danger:hover {
  color: #dc2626;
}

/* ---------- 楼中楼 ---------- */
.gb-replies {
  margin: 12px 0 0;
  padding: 0 0 0 14px;
  border-left: 2px solid var(--gb-line);
  list-style: none;
}
.gb-replies .gb-item {
  padding: 14px 0 0;
  border-top: 0;
}
.gb-reply {
  margin: 12px 0 0;
  padding: 12px;
  border: 1.5px solid var(--gb-line);
  border-radius: 12px;
  background: var(--gb-chip);
  transition: border-color 0.2s ease, box-shadow 0.2s ease;
}
.gb-reply-head {
  margin-bottom: 8px;
  color: var(--gb-soft);
  font-size: 13px;
}
.gb-reply-head b {
  color: var(--gb-brand);
  font-weight: 700;
}
.gb-reply-foot {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: 10px;
  margin-top: 8px;
}

/* ---------- 状态 / 更多 ---------- */
.gb-state {
  padding: 56px 0;
  color: var(--gb-muted);
  font-size: 14px;
  text-align: center;
}
.gb-state b {
  display: block;
  margin-bottom: 6px;
  color: var(--gb-soft);
  font-size: 15px;
  font-weight: 700;
}
.gb-state .gb-btn {
  margin-top: 14px;
}
.gb-more {
  display: flex;
  justify-content: center;
  padding: 22px 0 0;
}
.gb-end {
  padding: 24px 0 0;
  color: var(--gb-muted);
  font-size: 12.5px;
  text-align: center;
}
.gb-toast {
  margin-top: 12px;
  color: #dc2626;
  font-size: 13px;
}
.gb-toast.is-ok {
  color: #059669;
}

@keyframes gbFlash {
  0% {
    background: rgba(124, 108, 255, 0.12);
  }
  100% {
    background: transparent;
  }
}
@keyframes gbIn {
  from {
    opacity: 0;
    transform: translateY(6px);
  }
  to {
    opacity: 1;
    transform: none;
  }
}
.gb-enter {
  animation: gbIn 0.34s cubic-bezier(0.2, 0.7, 0.2, 1) both;
  animation-delay: var(--gb-delay, 0ms);
}

@media (max-width: 640px) {
  .gb-toolbar {
    align-items: stretch;
    flex-direction: column;
  }
  .gb-search {
    justify-content: flex-start;
  }
  .gb-search input {
    width: 100%;
  }
  .gb-avatar {
    width: 34px;
    height: 34px;
    font-size: 14px;
  }
  .gb-item {
    padding: 16px 0;
  }
}

/* 留言板页不显示主题自带的 Waline 评论区（本页已有自己的留言区） */
.comments-container,
#waline,
.comment-area-title {
  display: none !important;
}


/* ---------- 卡片墙排版（留言以卡片形式成墙） ---------- */
.gb-list {
  display: block;
  column-count: 3;
  column-gap: 16px;
}
.gb-list > .gb-state {
  column-span: all;
}
.gb-thread {
  break-inside: avoid;
  -webkit-column-break-inside: avoid;
  page-break-inside: avoid;
  position: relative;
  margin: 0 0 16px;
  padding: 20px 18px 14px 21px;
  overflow: hidden;
  border: 1px solid var(--gb-line);
  border-radius: 18px;
  background: var(--gb-paper);
  transition: transform 0.22s ease, box-shadow 0.22s ease, border-color 0.22s ease;
}
.gb-thread::before {
  content: "";
  position: absolute;
  left: 0;
  top: 14px;
  bottom: 14px;
  width: 3px;
  border-radius: 999px;
  background: var(--u-color, var(--gb-brand));
  opacity: 0.85;
}
.gb-thread:hover {
  transform: translateY(-2px);
  border-color: rgba(124, 108, 255, 0.42);
  box-shadow: 0 16px 30px rgba(8, 12, 30, 0.22);
}
.gb-thread .gb-item {
  padding: 0;
  border-top: 0;
}
.gb-thread .gb-item .gb-avatar.sm {
  width: 30px;
  height: 30px;
  font-size: 12px;
}
.gb-thread .gb-content {
  margin-top: 8px;
  font-size: 14.5px;
  line-height: 1.72;
}
.gb-replies {
  margin-top: 12px;
  padding: 12px 0 0;
  border-left: 0;
  border-top: 1px solid var(--gb-line);
}
.gb-replies .gb-item {
  padding: 12px 0 0;
}
.gb-replies-toggle {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  margin-top: 10px;
  padding: 0;
  border: 0;
  background: transparent;
  color: var(--gb-muted);
  font: inherit;
  font-size: 12.5px;
  cursor: pointer;
  transition: color 0.15s ease;
}
.gb-replies-toggle:hover {
  color: var(--gb-brand);
}
.gb-replies-toggle::before {
  content: "";
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: var(--u-color, var(--gb-brand));
  opacity: 0.55;
}

.gb-toast-list {
  column-span: all;
  display: block;
  margin: 0 0 12px;
  padding: 10px 14px;
  border: 1px solid rgba(220, 38, 38, 0.32);
  border-radius: 12px;
  background: rgba(220, 38, 38, 0.08);
  color: #dc2626;
  font-size: 13px;
}

/* 顶部：收起的发布入口 */
.gb-new {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 14px;
  padding: 14px 16px;
  border: 1px dashed var(--gb-line);
  border-radius: 16px;
  background: transparent;
  cursor: pointer;
  transition: border-color 0.2s ease, background-color 0.2s ease;
}
.gb-new:hover {
  border-color: var(--gb-brand);
  background: var(--gb-paper);
}
.gb-new-tip {
  color: var(--gb-muted);
  font-size: 14px;
}

@media (max-width: 1000px) {
  .gb-list {
    column-count: 2;
  }
}
@media (max-width: 680px) {
  .gb-list {
    column-count: 1;
  }
}

@media (prefers-reduced-motion: reduce) {
  .gb-enter,
  .gb-item.is-new {
    animation: none !important;
  }
}
</style>

<div class="gb" id="commentsPage">
  <div class="gb-head">
    <p class="gb-sub">
      想说什么都可以留在这里，登录后可以回复别人的留言。
      <span class="gb-count" id="gbCount">加载中</span>
    </p>
  </div>

  <div id="gbEditor" class="gb-editor-slot"></div>

  <div class="gb-toolbar">
    <div class="gb-tabs" id="gbSort">
      <button class="gb-tab is-active" type="button" data-sort="latest">最新</button>
      <button class="gb-tab" type="button" data-sort="oldest">最早</button>
    </div>
    <label class="gb-search" for="gbSearch">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true">
        <circle cx="11" cy="11" r="7"></circle>
        <path d="m20 20-3.2-3.2"></path>
      </svg>
      <input id="gbSearch" type="search" placeholder="搜索昵称或内容" autocomplete="off">
    </label>
  </div>

  <div class="gb-list" id="gbList">
    <div class="gb-state">正在加载留言…</div>
  </div>
  <div class="gb-more" id="gbMore"></div>
</div>
